name: "OmniSim Pre-Flight Safety Gate"
description: "Zero-consulting counterfactual simulation and autonomous self-healing patches for Infrastructure as Code."
author: "Deeven-Seru"
branding:
  icon: "shield"
  color: "yellow"

inputs:
  path:
    description: "Path to directory or Terraform .tf manifest to audit"
    required: false
    default: "examples/vulnerable_infrastructure.tf"
  fail-on-violation:
    description: "Whether to fail CI when critical SLA violations are caught ('true' or 'false')"
    required: false
    default: "true"
  output-patch:
    description: "Path where generated remediation unified diff patch should be written"
    required: false
    default: "omnisim-remediation.patch"

outputs:
  verdict:
    description: "Pre-flight audit verdict (PASS or BLOCKED)"
    value: ${{ steps.audit.outputs.verdict }}
  patch-path:
    description: "Path to generated unified diff patch"
    value: ${{ steps.audit.outputs.patch_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install OmniSim
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Run OmniSim Pre-Flight Audit
      id: audit
      shell: bash
      run: |
        echo "::group::OmniSim Pre-Flight Simulation Audit"
        FAIL_FLAG=""
        if [ "${{ inputs.fail-on-violation }}" = "true" ]; then
          FAIL_FLAG="--fail-on-violation"
        fi

        python -m omnisim.cli patch "${{ inputs.path }}" --output "${{ inputs.output-patch }}" $FAIL_FLAG
        EXIT_CODE=$?

        if [ -f "${{ inputs.output-patch }}" ]; then
          echo "patch_path=${{ inputs.output-patch }}" >> $GITHUB_OUTPUT
          echo "verdict=BLOCKED" >> $GITHUB_OUTPUT
        else
          echo "patch_path=" >> $GITHUB_OUTPUT
          echo "verdict=PASS" >> $GITHUB_OUTPUT
        fi
        echo "::endgroup::"
        exit $EXIT_CODE
