<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Palantir Blueprint Background Ground -->
    <radialGradient id="bannerBg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#14161C" />
      <stop offset="50%" stop-color="#0D0E12" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <!-- Hairline Accent Line -->
    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFEFEF" stop-opacity="0" />
      <stop offset="30%" stop-color="#EFEFEF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#EFEFEF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EFEFEF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEFEF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#EFEFEF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#EFEFEF" stop-opacity="0.25" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Frame -->
  <rect width="1200" height="420" fill="url(#bannerBg)" />
  <rect width="1196" height="416" x="2" y="2" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Blueprint Lattice Grid (Palantir Monochrome) -->
  <g opacity="0.08" stroke="#EFEFEF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Geometric Horizon Divider Line -->
  <line x1="120" y1="230" x2="1080" y2="230" stroke="url(#hairlineGrad)" stroke-width="1" />

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <!-- Earmark Tag -->
    <text x="600" y="85" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" letter-spacing="4" fill="#8E9094">01 ——→ THE FOUNDATIONAL WORLD MODEL</text>
    
    <!-- Hero Title (Grotesque Large Tight) -->
    <text x="600" y="165" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="400" letter-spacing="-3" fill="#EFEFEF">OMNISIM</text>
    
    <!-- Subtitle -->
    <text x="600" y="210" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="500" letter-spacing="3" fill="#B0B2B6">FOUNDATIONAL SOFTWARE FOR INFRASTRUCTURE SURVIVABILITY</text>

    <!-- Narrative Pitch -->
    <text x="600" y="275" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400" letter-spacing="0.4" fill="#92949A">
      Simulate the future of infrastructure before execution. Action-conditioned world models for zero-downtime CI.
    </text>

    <!-- Badges Row -->
    <g transform="translate(305, 318)">
      <!-- Badge 1: Architecture -->
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#14151B" stroke="#EFEFEF" stroke-width="1" stroke-opacity="0.4" />
      <text x="90" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="1" fill="#EFEFEF">CAUSAL ONTOLOGY</text>

      <!-- Badge 2: Invariant -->
      <rect x="200" y="0" width="200" height="34" rx="17" fill="#14151B" stroke="#EFEFEF" stroke-width="1" stroke-opacity="0.4" />
      <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="1" fill="#EFEFEF">100% INVARIANT GATE</text>

      <!-- Badge 3: CI/CD -->
      <rect x="420" y="0" width="170" height="34" rx="17" fill="#14151B" stroke="#EFEFEF" stroke-width="1" stroke-opacity="0.4" />
      <text x="505" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="1" fill="#EFEFEF">PRE-MERGE RADAR</text>
    </g>
  </g>
</svg>
