<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1A1813" />
      <stop offset="60%" stop-color="#0D0C09" />
      <stop offset="100%" stop-color="#050504" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="30%" stop-color="#E5B942" />
      <stop offset="70%" stop-color="#C29328" />
      <stop offset="100%" stop-color="#8F6914" />
    </linearGradient>

    <!-- Subtle Gold Stroke Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B942" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8F6914" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E5B942" stop-opacity="0.6" />
    </linearGradient>

    <!-- Path Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" />

  <!-- Subtle Coordinate Lattices -->
  <g opacity="0.08" stroke="#E5B942" stroke-width="1">
    <line x1="80" y1="80" x2="432" y2="80" />
    <line x1="80" y1="168" x2="432" y2="168" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="344" x2="432" y2="344" />
    <line x1="80" y1="432" x2="432" y2="432" />
    <line x1="80" y1="80" x2="80" y2="432" />
    <line x1="168" y1="80" x2="168" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="344" y1="80" x2="344" y2="432" />
    <line x1="432" y1="80" x2="432" y2="432" />
  </g>

  <!-- Multiverse Trajectory Branches -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Counterfactual Branch 1 (Upper Breached Path) -->
    <path d="M 120 256 C 180 256, 210 148, 290 148 C 340 148, 380 120, 410 120" stroke="#7A6328" stroke-width="3" stroke-dasharray="4 6" opacity="0.5" />
    
    <!-- Counterfactual Branch 2 (Mid-Low Divergence Path) -->
    <path d="M 120 256 C 190 256, 230 380, 310 380 C 360 380, 380 396, 410 396" stroke="#7A6328" stroke-width="3" stroke-dasharray="4 6" opacity="0.5" />

    <!-- Counterfactual Branch 3 (Near Failure Recovery) -->
    <path d="M 290 148 C 340 148, 360 220, 410 220" stroke="#A88126" stroke-width="4" opacity="0.7" />

    <!-- Master Golden Trajectory (Optimal Intervention Path) -->
    <path d="M 120 256 C 200 256, 240 280, 310 280 C 370 280, 380 260, 416 260" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)" />
  </g>

  <!-- Graph Nodes -->
  <!-- Origin State S0 -->
  <circle cx="120" cy="256" r="16" fill="url(#goldGrad)" filter="url(#nodeGlow)" />
  <circle cx="120" cy="256" r="8" fill="#0D0C09" />
  <circle cx="120" cy="256" r="4" fill="#FFF2B2" />

  <!-- Intermediate Branch Points -->
  <circle cx="290" cy="148" r="8" fill="#8F6914" stroke="#FFF2B2" stroke-width="2" />
  <circle cx="310" cy="280" r="10" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <circle cx="310" cy="380" r="7" fill="#574312" stroke="#8F6914" stroke-width="2" />

  <!-- Target Optimal Outcome Node -->
  <circle cx="416" cy="260" r="13" fill="url(#goldGrad)" filter="url(#nodeGlow)" />
  <circle cx="416" cy="260" r="6" fill="#0D0C09" />
  <circle cx="416" cy="260" r="3" fill="#FFF2B2" />

  <!-- Breached Outcome Nodes -->
  <circle cx="410" cy="120" r="7" fill="#3D3012" stroke="#7A6328" stroke-width="2" />
  <circle cx="410" cy="220" r="7" fill="#6B5117" stroke="#A88126" stroke-width="2" />
  <circle cx="410" cy="396" r="7" fill="#3D3012" stroke="#7A6328" stroke-width="2" />
</svg>