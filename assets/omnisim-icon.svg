<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#14151B" />
      <stop offset="60%" stop-color="#0D0E12" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <!-- Subtle Hairline Stroke -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEFEF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#EFEFEF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#EFEFEF" stop-opacity="0.5" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#borderStroke)" stroke-width="2" />

  <!-- Subtle Coordinate Blueprint Lattice -->
  <g opacity="0.08" stroke="#EFEFEF" stroke-width="1">
    <line x1="80" y1="80" x2="432" y2="80" />
    <line x1="80" y1="168" x2="432" y2="168" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="344" x2="432" y2="344" />
    <line x1="80" y1="432" x2="432" y2="432" />
    <line x1="80" y1="80" x2="80" y2="432" />
    <line x1="168" y1="80" x2="168" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="344" y1="80" x2="344" y2="432" />
    <line x1="432" y1="80" x2="432" y2="432" />
  </g>

  <!-- Multiverse Trajectory Branches -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Counterfactual Branch 1 (Upper Breached Path) -->
    <path d="M 120 256 C 180 256, 210 148, 290 148 C 340 148, 380 120, 410 120" stroke="#606268" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
    
    <!-- Counterfactual Branch 2 (Mid-Low Divergence Path) -->
    <path d="M 120 256 C 190 256, 230 380, 310 380 C 360 380, 380 396, 410 396" stroke="#606268" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Counterfactual Branch 3 (Near Failure Recovery) -->
    <path d="M 290 148 C 340 148, 360 220, 410 220" stroke="#888A90" stroke-width="3" opacity="0.75" />

    <!-- Master Trajectory (Optimal Intervention Path) -->
    <path d="M 120 256 C 200 256, 240 280, 310 280 C 370 280, 380 260, 416 260" stroke="#EFEFEF" stroke-width="6" filter="url(#subtleGlow)" />
  </g>

  <!-- Graph Nodes -->
  <!-- Origin State S0 -->
  <circle cx="120" cy="256" r="14" fill="#EFEFEF" />
  <circle cx="120" cy="256" r="7" fill="#0D0E12" />
  <circle cx="120" cy="256" r="3" fill="#EFEFEF" />

  <!-- Intermediate Branch Points -->
  <circle cx="290" cy="148" r="7" fill="#14151B" stroke="#EFEFEF" stroke-width="1.5" />
  <circle cx="310" cy="280" r="9" fill="#EFEFEF" />
  <circle cx="310" cy="380" r="6" fill="#0D0E12" stroke="#888A90" stroke-width="1.5" />

  <!-- Target Optimal Outcome Node -->
  <circle cx="416" cy="260" r="12" fill="#EFEFEF" />
  <circle cx="416" cy="260" r="5" fill="#0D0E12" />
  <circle cx="416" cy="260" r="2.5" fill="#EFEFEF" />

  <!-- Breached Outcome Nodes -->
  <circle cx="410" cy="120" r="6" fill="#14151B" stroke="#606268" stroke-width="1.5" />
  <circle cx="410" cy="220" r="6" fill="#14151B" stroke="#888A90" stroke-width="1.5" />
  <circle cx="410" cy="396" r="6" fill="#14151B" stroke="#606268" stroke-width="1.5" />
</svg>
