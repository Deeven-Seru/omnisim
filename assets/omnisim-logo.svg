<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08080A" />
      <stop offset="50%" stop-color="#100F0C" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF5C2" />
      <stop offset="35%" stop-color="#E5B942" />
      <stop offset="70%" stop-color="#D4A028" />
      <stop offset="100%" stop-color="#F2D172" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#A67C1E" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="220" rx="20" fill="url(#logoBgGrad)" />
  <rect width="956" height="216" x="2" y="2" rx="18" fill="none" stroke="#E5B942" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Left Icon Emblem (Glyph) -->
  <g transform="translate(48, 30)">
    <!-- Subtle Grid Box -->
    <rect width="160" height="160" rx="36" fill="#14130F" stroke="#E5B942" stroke-opacity="0.35" stroke-width="1.5" />
    
    <!-- Branches -->
    <path d="M 36 80 C 60 80, 70 45, 100 45 C 120 45, 125 36, 136 36" fill="none" stroke="#7A6328" stroke-width="2.5" stroke-dasharray="3 4" opacity="0.6" />
    <path d="M 36 80 C 60 80, 75 120, 105 120 C 122 120, 128 128, 136 128" fill="none" stroke="#7A6328" stroke-width="2.5" stroke-dasharray="3 4" opacity="0.6" />
    <path d="M 36 80 C 65 80, 80 88, 105 88 C 122 88, 126 80, 138 80" fill="none" stroke="url(#accentGold)" stroke-width="4.5" filter="url(#logoGlow)" />

    <!-- Nodes -->
    <circle cx="36" cy="80" r="8" fill="url(#accentGold)" filter="url(#logoGlow)" />
    <circle cx="36" cy="80" r="3.5" fill="#0D0C09" />
    <circle cx="105" cy="88" r="5" fill="url(#accentGold)" />
    <circle cx="138" cy="80" r="7" fill="url(#accentGold)" filter="url(#logoGlow)" />
    <circle cx="138" cy="80" r="3" fill="#0D0C09" />
    <circle cx="136" cy="36" r="4" fill="#6B5117" />
    <circle cx="136" cy="128" r="4" fill="#6B5117" />
  </g>

  <!-- Typography -->
  <g transform="translate(248, 0)">
    <!-- Wordmark -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Roboto', sans-serif" font-size="72" font-weight="900" letter-spacing="6" fill="url(#textGoldGrad)">OMNISIM</text>
    
    <!-- Badge Pill -->
    <rect x="420" y="66" width="170" height="28" rx="14" fill="#241E11" stroke="#E5B942" stroke-width="1.2" />
    <text x="505" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFF2B2">ENTERPRISE TIER</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="152" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="3.5" fill="#C29328">UNIVERSAL COUNTERFACTUAL SIMULATION ENGINE</text>
    
    <!-- Architectural Specification Metadata -->
    <text x="2" y="178" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1" fill="#7A683D">PRE-EXECUTION INVARIANT VERIFICATION • STATE-ACTION-CONSEQUENCE (SAC)</text>
  </g>
</svg>