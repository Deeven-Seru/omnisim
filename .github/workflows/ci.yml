name: OmniSim CI Test & Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Core Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify CLI Simulation Runner
        run: |
          python -m omnisim.cli --domain systems --horizon 6
          python -m omnisim.cli simulate --domain systems --horizon 6
          python -m omnisim.cli benchmark --domain systems --rollouts 50 --horizon 6
          python -m omnisim.cli terraform
          python -m omnisim.cli patch
          python -m omnisim.cli vc-gauntlet
          python -m omnisim.cli dataset-benchmark
          python -m omnisim.cli canonical-benchmarks

      - name: Verify GitHub Action Pre-Flight Gate
        uses: ./
        with:
          path: "examples/safe_infrastructure.tf"
          fail-on-violation: "true"

      - name: Verify Package Build
        run: |
          pip install build
          python -m build
