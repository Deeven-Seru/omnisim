[project]
name = "omnisim"
version = "0.1.0"
description = "OmniSim: The Universal Counterfactual Simulation Engine - Beyond Probabilistic Text Generation to Action-Conditioned World Simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
accelerated = [
    "torch>=2.2.0",
]
notebook = [
    "marimo>=0.8.0",
    "matplotlib>=3.7.0",
]
all = [
    "torch>=2.2.0",
    "marimo>=0.8.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
