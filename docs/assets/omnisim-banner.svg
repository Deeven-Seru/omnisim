<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Canvas Background -->
    <radialGradient id="bannerBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#16140F" />
      <stop offset="45%" stop-color="#0C0B08" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Lustrous Gold Gradient -->
    <linearGradient id="goldHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#E5B942" />
      <stop offset="80%" stop-color="#C29328" />
      <stop offset="100%" stop-color="#FCE592" />
    </linearGradient>

    <linearGradient id="goldAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B942" stop-opacity="0" />
      <stop offset="30%" stop-color="#E5B942" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFF2B2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C29328" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B942" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3D3012" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E5B942" stop-opacity="0.4" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Frame -->
  <rect width="1200" height="420" fill="url(#bannerBg)" />
  <rect width="1196" height="416" x="2" y="2" fill="none" stroke="url(#goldBorderGrad)" stroke-width="2" />

  <!-- Mathematical Coordinate System Grid -->
  <g opacity="0.05" stroke="#E5B942" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Geometric Horizon Axis Accent Line -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="url(#goldAccentLine)" stroke-width="1.5" />

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <!-- Top Monospace Architecture Tag -->
    <text x="600" y="85" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="4" fill="#C29328">STATE-ACTION-CONSEQUENCE (SAC) SIMULATION ARCHITECTURE</text>
    
    <!-- Hero Title -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="84" font-weight="900" letter-spacing="12" fill="url(#goldHdr)" filter="url(#bannerGlow)">OMNISIM</text>
    
    <!-- Subtitle -->
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="500" letter-spacing="5" fill="#E5B942">THE UNIVERSAL COUNTERFACTUAL SIMULATION ENGINE</text>

    <!-- Narrative Pitch -->
    <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="400" letter-spacing="1.2" fill="#A89872">
      Zero Blind Deployments. Simulate 10,000 Counterfactual Future Timelines Before Modifying Production State.
    </text>

    <!-- Badges Row -->
    <g transform="translate(330, 318)">
      <!-- Badge 1: Architecture -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#1A1812" stroke="#E5B942" stroke-width="1" />
      <text x="80" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#FFF2B2">MCTS + SAC ENGINE</text>

      <!-- Badge 2: Latency -->
      <rect x="180" y="0" width="180" height="34" rx="17" fill="#1A1812" stroke="#E5B942" stroke-width="1" />
      <text x="270" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#FFF2B2">&lt; 0.2ms PER ROLLOUT</text>

      <!-- Badge 3: CI/CD -->
      <rect x="380" y="0" width="160" height="34" rx="17" fill="#1A1812" stroke="#E5B942" stroke-width="1" />
      <text x="460" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#FFF2B2">CI/CD GATEWAY</text>
    </g>
  </g>
</svg>